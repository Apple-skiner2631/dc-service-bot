<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機器人控制台</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#272b35;--text:#e6e8ee;--mute:#8b92a3;--accent:#5865f2;--ok:#3ba55d;--bad:#ed4245}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
.hidden{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.center{max-width:360px;margin:15vh auto 0}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:28px 0 12px}
input,select,textarea,button{font:inherit;color:var(--text);background:#10131a;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
button{width:auto;background:var(--accent);border:0;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;border:1px solid var(--line)}
button.danger{background:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--mute)}
.chip b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;color:var(--mute)}
.row span:last-child{color:var(--text);text-align:right;word-break:break-all}
.gname{font-weight:700;margin-bottom:4px}
.form{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.switch input{width:auto}
.field{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.roles{max-height:180px;overflow:auto;display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px}
.roles label{display:flex;align-items:center;gap:8px}.roles input{width:auto}
#logs{margin:0;background:#0a0c10;border:1px solid var(--line);border-radius:8px;padding:12px;height:260px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
</style>
</head>
<body>

<div id="login" class="card center hidden">
  <h1>🤖 機器人控制台</h1>
  <p id="loginMsg" style="color:var(--mute);font-size:14px">請輸入控制台密碼</p>
  <div class="form">
    <input id="pw" type="password" placeholder="密碼" autocomplete="current-password">
    <button id="loginBtn">登入</button>
  </div>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="wrap hidden">
  <div class="bar">
    <h1>🤖 <span id="botName">機器人</span></h1>
    <div style="display:flex;gap:8px">
      <button class="danger" id="restartBtn">重新啟動</button>
      <button class="ghost" id="logoutBtn">登出</button>
    </div>
  </div>
  <div class="chips">
    <div class="chip">延遲 <b id="cLat">-</b></div>
    <div class="chip">運行 <b id="cUp">-</b></div>
    <div class="chip">記憶體 <b id="cMem">-</b></div>
    <div class="chip">伺服器 <b id="cGuilds">-</b></div>
  </div>

  <h2>伺服器</h2>
  <div id="guilds" class="grid"></div>

  <h2>伺服器設定</h2>
  <div class="card form">
    <select id="setGuild"></select>
    <div id="settingsBox" class="form"></div>
  </div>

  <h2>以機器人身分發送訊息</h2>
  <div class="card form">
    <div class="two">
      <select id="sendGuild"></select>
      <select id="sendChannel"></select>
    </div>
    <textarea id="sendText" maxlength="2000" placeholder="輸入要發送的訊息（不會觸發 @ 提及）"></textarea>
    <div><button id="sendBtn">發送</button></div>
  </div>

  <h2>機器人日誌</h2>
  <pre id="logs"></pre>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let guildKey = "";
let timer = null;

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}

async function api(path, body) {
  const options = { credentials: "same-origin" };
  if (body !== undefined) {
    options.method = "POST";
    options.headers = { "Content-Type": "application/json" };
    options.body = JSON.stringify(body);
  }
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) showLogin();
  if (!res.ok) throw new Error(data.error || "請求失敗");
  return data;
}

function showLogin(configured = true) {
  clearInterval(timer);
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  if (!configured) {
    $("loginMsg").textContent = "尚未設定 DASHBOARD_PASSWORD，請先到 Render 的環境變數設定密碼。";
    $("pw").disabled = true;
    $("loginBtn").disabled = true;
  }
}

function showApp() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  refresh();
  clearInterval(timer);
  timer = setInterval(refresh, 10000);
}

function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}天 ${h}時` : h ? `${h}時 ${m}分` : `${m}分`;
}

function renderGuilds(guilds) {
  const box = $("guilds");
  box.textContent = "";
  for (const g of guilds) {
    const card = document.createElement("div");
    card.className = "card";
    const name = document.createElement("div");
    name.className = "gname";
    name.textContent = g.name;
    card.appendChild(name);
    const rows = [["成員", g.members], ["語音房觸發", g.room], ["陷阱頻道", g.trap], ["通告頻道", g.punish], ["開票頻道", g.ticket]];
    for (const [label, value] of rows) {
      const row = document.createElement("div");
      row.className = "row";
      const a = document.createElement("span");
      a.textContent = label;
      const b = document.createElement("span");
      b.textContent = value === null || value === undefined ? "未設定" : typeof value === "string" ? "#" + value : value;
      row.append(a, b);
      card.appendChild(row);
    }
    const sw = document.createElement("label");
    sw.className = "switch";
    const box2 = document.createElement("input");
    box2.type = "checkbox";
    box2.checked = g.autoban;
    box2.onchange = async () => {
      try {
        await api(`/api/guilds/${g.id}/autoban`, { enabled: box2.checked });
        toast(`自動封鎖已${box2.checked ? "開啟" : "關閉"}`);
      } catch (e) {
        box2.checked = !box2.checked;
        toast(e.message);
      }
    };
    sw.append(box2, document.createTextNode("陷阱頻道自動封鎖"));
    card.appendChild(sw);
    if (g.voice) {
      const vrow = document.createElement("div");
      vrow.className = "row";
      const vtext = document.createElement("span");
      vtext.textContent = "語音：" + g.voice + (g.playing ? " ♪ " + g.playing : "");
      const vbtn = document.createElement("button");
      vbtn.className = "ghost";
      vbtn.textContent = "停止並離開";
      vbtn.onclick = async () => {
        try { await api(`/api/guilds/${g.id}/voice/leave`, {}); toast("已離開語音頻道"); refresh(); } catch (e) { toast(e.message); }
      };
      vrow.append(vtext, vbtn);
      card.appendChild(vrow);
    }
    box.appendChild(card);
  }
}

function renderGuildSelect(guilds) {
  const key = guilds.map(g => g.id).join(",");
  if (key === guildKey) return;
  guildKey = key;
  for (const id of ["sendGuild", "setGuild"]) {
    const sel = $(id);
    sel.textContent = "";
    for (const g of guilds) sel.add(new Option(g.name, g.id));
  }
  loadChannels();
  loadSettings();
}

const SETTINGS = [
  ["room", "語音房觸發頻道", "voice"],
  ["trap", "陷阱頻道", "text"],
  ["punish", "通告頻道", "text"],
  ["ticket_panel", "開票訊息頻道", "text"],
  ["ticket_pending", "待處理分類", "categories"],
  ["ticket_resolved", "已處理分類", "categories"],
];

async function loadSettings() {
  const id = $("setGuild").value;
  const box = $("settingsBox");
  box.textContent = "";
  if (!id) return;
  let data;
  try {
    data = await api(`/api/guilds/${id}/settings`);
  } catch (e) {
    return toast(e.message);
  }
  for (const [key, label, kind] of SETTINGS) {
    const wrap = document.createElement("label");
    wrap.className = "field";
    const title = document.createElement("span");
    title.textContent = label;
    const sel = document.createElement("select");
    sel.add(new Option("未設定", ""));
    for (const c of data[kind]) sel.add(new Option(c.name, c.id));
    sel.value = data.config[key] || "";
    sel.onchange = async () => {
      try {
        const r = await api(`/api/guilds/${id}/settings`, { key, value: sel.value || null });
        toast(r.warning || "已儲存");
        refresh();
      } catch (e) {
        toast(e.message);
        loadSettings();
      }
    };
    wrap.append(title, sel);
    box.appendChild(wrap);
  }
  const staffWrap = document.createElement("div");
  staffWrap.className = "field";
  const staffTitle = document.createElement("span");
  staffTitle.textContent = "票務管理身分組";
  const list = document.createElement("div");
  list.className = "roles";
  for (const role of data.roles) {
    const row = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = data.staff.includes(role.id);
    cb.onchange = async () => {
      try {
        await api(`/api/guilds/${id}/staff`, { role_id: role.id, enabled: cb.checked });
        toast("已儲存");
      } catch (e) {
        cb.checked = !cb.checked;
        toast(e.message);
      }
    };
    row.append(cb, document.createTextNode(role.name));
    list.appendChild(row);
  }
  staffWrap.append(staffTitle, list);
  box.appendChild(staffWrap);
}

async function loadLogs() {
  try {
    const data = await api("/api/logs");
    const pre = $("logs");
    const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
    pre.textContent = data.lines.join("\n");
    if (stick) pre.scrollTop = pre.scrollHeight;
  } catch (e) {}
}

async function loadChannels() {
  const sel = $("sendChannel");
  sel.textContent = "";
  const id = $("sendGuild").value;
  if (!id) return;
  try {
    const data = await api(`/api/guilds/${id}/channels`);
    for (const c of data.channels) sel.add(new Option("#" + c.name, c.id));
  } catch (e) {
    toast(e.message);
  }
}

async function refresh() {
  try {
    const s = await api("/api/status");
    $("botName").textContent = s.bot;
    $("cLat").textContent = s.latency === null ? "-" : s.latency + " ms";
    $("cUp").textContent = fmtUptime(s.uptime);
    $("cMem").textContent = s.memory + " MB";
    $("cGuilds").textContent = s.guilds.length;
    renderGuilds(s.guilds);
    renderGuildSelect(s.guilds);
    loadLogs();
  } catch (e) {
    if (!$("app").classList.contains("hidden")) toast(e.message);
  }
}

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try {
    await api("/api/login", { password: $("pw").value });
    $("pw").value = "";
    showApp();
  } catch (e) {
    $("loginErr").textContent = e.message;
  }
};
$("pw").onkeydown = e => { if (e.key === "Enter") $("loginBtn").click(); };

$("logoutBtn").onclick = async () => {
  await api("/api/logout", {}).catch(() => {});
  showLogin();
};

$("sendGuild").onchange = loadChannels;
$("setGuild").onchange = loadSettings;

$("sendBtn").onclick = async () => {
  const text = $("sendText").value.trim();
  const channel = $("sendChannel").value;
  if (!text || !channel) return toast("請選擇頻道並輸入訊息");
  $("sendBtn").disabled = true;
  try {
    await api("/api/send", { channel_id: channel, content: text });
    $("sendText").value = "";
    toast("已發送");
  } catch (e) {
    toast(e.message);
  }
  $("sendBtn").disabled = false;
};

$("restartBtn").onclick = async () => {
  if (!confirm("確定要重新啟動機器人嗎？期間所有指令都無法使用。")) return;
  try {
    await api("/api/restart", {});
    toast("正在重新啟動，約需 30 到 90 秒...");
    clearInterval(timer);
    setTimeout(() => {
      timer = setInterval(async () => {
        try {
          await api("/api/status");
          toast("機器人已恢復上線");
          showApp();
        } catch (e) {}
      }, 5000);
    }, 10000);
  } catch (e) {
    toast(e.message);
  }
};

(async () => {
  try {
    const s = await api("/api/session");
    if (!s.configured) return showLogin(false);
    s.authed ? showApp() : showLogin();
  } catch (e) {
    showLogin();
  }
})();
</script>
</body>
</html>
